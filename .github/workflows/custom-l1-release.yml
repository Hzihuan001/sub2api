name: L1 custom CI and GHCR release

on:
  workflow_dispatch:
  push:
    tags:
      - 'custom-l1-*'

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-l1-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CUSTOM_VERSION: 0.2.2-l1.10

jobs:
  quality:
    name: Focused quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Verify release tag
        run: test "$GITHUB_REF_NAME" = 'custom-l1-0.2.2.10'

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Backend reseller tests
        working-directory: backend
        run: go test ./internal/moshureseller ./internal/service

      - name: Frontend typecheck and locale tests
        working-directory: frontend
        run: |
          pnpm run typecheck
          pnpm exec vitest run src/i18n/__tests__/localeKeyCompleteness.spec.ts

      - name: Frontend production build
        working-directory: frontend
        run: pnpm run build

  publish:
    name: Build and publish L1 image
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: buildmeta
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/hzihuan001/sub2api:${{ env.CUSTOM_VERSION }}
          build-args: |
            NODE_IMAGE=node:24-alpine
            VERSION=${{ env.CUSTOM_VERSION }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.buildmeta.outputs.date }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.CUSTOM_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.buildmeta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
