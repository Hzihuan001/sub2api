name: L1 custom CI and GHCR release

on:
  workflow_dispatch:
  push:
    tags:
      - 'custom-l1-*'

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-l1-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CUSTOM_VERSION: 0.2.5-l1.3

jobs:
  quality:
    name: Full quality gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: proxy-ci-only
          POSTGRES_DB: proxy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d proxy_test"
          --health-interval=5s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      PROMPT_AUDIT_TEST_POSTGRES_DSN: postgres://postgres:proxy-ci-only@127.0.0.1:5432/proxy_test?sslmode=disable
      PROMPT_AUDIT_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Verify locked toolchain
        run: |
          go version | grep -q 'go1.27.0'
          node --version | grep -q '^v20\.'
          test "$(pnpm --version)" = '9.15.9'

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Backend unit tests
        working-directory: backend
        run: make test-unit

      - name: Full backend integration tests
        working-directory: backend
        run: go test -p=1 -tags=integration ./...

      - name: Backend lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m
          working-directory: backend

      - name: Frontend quality
        working-directory: frontend
        run: |
          pnpm run lint:check
          pnpm run typecheck
          pnpm run test:run

      - name: Frontend production build
        working-directory: frontend
        run: pnpm run build

  publish:
    name: Build and publish L1 image
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: buildmeta
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/hzihuan001/sub2api:${{ env.CUSTOM_VERSION }}
          build-args: |
            NODE_IMAGE=node:24-alpine
            VERSION=${{ env.CUSTOM_VERSION }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.buildmeta.outputs.date }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.CUSTOM_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.buildmeta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
