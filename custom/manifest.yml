version: 1
name: sub2api-custom-layer
contracts: custom/contracts.json
upstream:
  remote: upstream
  mirror_branch: upstream/main
  base_ref_pattern: v*

# contracts.json is consumed by scripts/custom_contracts.py and sync checks.
# Tests below document coverage; executable argv and dependency rules live there.
features:
  - id: key-routing
    owner: custom/key-routing
    description: Ordered API key backup groups, read-only preflight and effective-group billing on stateless text requests; no upstream replay.
    tests:
      - backend/internal/keyrouting
      - backend/internal/service/key_routing_service_test.go
      - backend/internal/service/key_routing_readiness_test.go
      - backend/internal/service/custom_api_key_routes_test.go
      - backend/internal/repository/custom_api_key_routes_test.go
      - backend/internal/repository/custom_api_key_routes_integration_test.go
      - backend/internal/server/middleware/key_routing_test.go
      - backend/internal/server/middleware/key_routing_json_test.go
      - backend/internal/server/routes/key_routing_test.go
      - frontend/src/features/key-routing
      - frontend/src/views/user/__tests__/KeysView.spec.ts
  - id: gateway-resilience
    owner: custom/gateway-resilience
    description: Shared failure classification, per-group failure thresholds, recoverable account-wide cooldown and safe pre-output failover.
    tests:
      - backend/internal/service/overload_failure_breaker_test.go
      - backend/internal/service/openai_overload_failover_test.go
      - backend/internal/service/openai_ws_ingress_overload_test.go
      - backend/internal/repository/overload_failure_cache_test.go
      - backend/internal/service/gateway_failure_policy_test.go
      - backend/internal/service/gateway_failure_policy_stream_test.go
      - backend/internal/service/group_failure_policy_settings_test.go
      - backend/internal/service/group_failure_breaker_test.go
      - backend/internal/service/group_failure_runtime_hooks_test.go
      - backend/internal/service/group_failure_native_scheduling_test.go
      - backend/internal/service/group_failure_recovery_test.go
      - backend/internal/repository/group_failure_cache_test.go
      - backend/internal/handler/admin/setting_handler_group_failure_policy_test.go
      - backend/internal/handler/admin/account_handler_group_failure_recovery_test.go
      - frontend/src/features/gateway-resilience
      - frontend/src/views/admin/__tests__/GroupsView.codexManifest.spec.ts
      - deploy/tests/gateway-failover-smoke.ps1
  - id: operator
    owner: custom/operator
    description: Operator role permissions and management-menu policy.
    tests:
      - backend/internal/authz/...
      - frontend/src/authz
  - id: prompt-audit
    owner: custom/prompt-audit
    description: Prompt capture, audit events, retention and administration UI.
    tests:
      - backend/internal/securityaudit/...
      - frontend/src/features/prompt-audit
  - id: image-studio
    owner: custom/image-studio
    description: Image studio, batch fan-out, references and downloads.
    tests:
      - backend/internal/service/batch_image_...
      - frontend/src/features/image-studio
  - id: branding
    owner: custom/branding
    description: Runtime site branding and public-facing terminology.
    tests:
      - frontend/src/i18n
  - id: usage-extras
    owner: custom/usage-extras
    description: Admin-only usage presentation and API-key administration helpers.
    tests:
      - backend/internal/handler/admin/usage_handler.go
      - frontend/src/views/admin

policies:
  generated_sources:
    - backend/ent
    - backend/cmd/server/wire_gen.go
  immutable_migrations: true
  custom_migration_prefix: 9000_custom_
  production_deploy_from_sync_pr: false
