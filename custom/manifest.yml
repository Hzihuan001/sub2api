version: 1
name: sub2api-custom-layer
contracts: custom/contracts.json
upstream:
  remote: upstream
  mirror_branch: upstream/main
  base_ref_pattern: v*

# contracts.json is consumed by scripts/custom_contracts.py and sync checks.
# Tests below document coverage; executable argv and dependency rules live there.
features:
  - id: key-routing
    owner: custom/key-routing
    description: Ordered API key backup groups, independent per-key failure/SLA/TTFT/status rules, model admission and authorized multi-group catalogue aggregation, bounded safe pre-output dispatch, effective-group native billing, and bounded fail-closed Responses continuation recovery for supported official API-key state.
    tests:
      - backend/internal/keyrouting
      - backend/internal/keyrouting/failure_tracker_test.go
      - backend/internal/service/key_routing_service_test.go
      - backend/internal/service/key_routing_readiness_test.go
      - backend/internal/service/custom_api_key_routes_test.go
      - backend/internal/repository/custom_api_key_routes_test.go
      - backend/internal/repository/custom_api_key_routes_integration_test.go
      - backend/internal/server/middleware/key_routing_test.go
      - backend/internal/server/middleware/key_routing_json_test.go
      - backend/internal/server/routes/key_routing_test.go
      - backend/internal/handler/key_route_failover_test.go
      - backend/internal/handler/key_route_dispatch_test.go
      - backend/internal/handler/key_route_first_content_writer_test.go
      - backend/internal/handler/key_route_first_content_sample_test.go
      - backend/internal/service/key_route_hosted_tools_test.go
      - backend/internal/service/key_route_hosted_tools_unit_test.go
      - backend/internal/handler/key_model_listing_test.go
      - backend/internal/handler/key_route_catalogue_test.go
      - backend/internal/handler/key_route_catalogue_pinned_test.go
      - backend/internal/service/key_route_catalogue_test.go
      - backend/internal/server/middleware/key_route_catalogue_test.go
      - backend/internal/server/middleware/key_model_policy_test.go
      - backend/internal/service/key_model_admission_test.go
      - backend/internal/service/key_model_policy_crud_unit_test.go
      - backend/internal/handler/key_route_unavailable_test.go
      - backend/internal/service/key_route_failure_policy_test.go
      - backend/migrations/9000_custom_api_key_routes.sql
      - backend/migrations/9001_custom_api_key_route_policies.sql
      - backend/migrations/9002_custom_api_key_model_policies.sql
      - frontend/src/features/key-routing
      - frontend/src/views/user/__tests__/KeysView.spec.ts
      - backend/internal/keyrouting/account_attempt_test.go
      - backend/internal/keyrouting/account_health_test.go
      - backend/internal/service/key_account_routing_runtime_test.go
      - backend/internal/service/key_account_routing_runtime_batch_test.go
      - backend/internal/service/key_account_route_probe_test.go
      - backend/internal/service/key_account_openai_transport_test.go
      - backend/internal/service/key_account_kiro_protocol_test.go
      - backend/internal/service/key_account_pricing_carrier_test.go
      - backend/internal/handler/key_account_dispatch_test.go
      - backend/internal/handler/key_account_partial_usage_test.go
      - backend/internal/handler/key_account_pricing_test.go
      - backend/internal/repository/key_account_health_test.go
      - backend/internal/repository/key_account_health_integration_test.go
      - backend/internal/repository/key_account_site_integration_test.go
      - backend/internal/repository/custom_api_key_account_routes_integration_test.go
      - backend/migrations/9003_custom_api_key_account_routes.sql
      - backend/migrations/9004_custom_key_route_site.sql
      - frontend/src/features/key-routing/__tests__/KeyRouteScopeNotice.spec.ts
  - id: gateway-resilience
    owner: custom/gateway-resilience
    description: Shared failure classification and native protections. Group status-code rules are defaults for key-local backup routing, not custom account-wide stops; legacy account cooldown cleanup remains supported.
    tests:
      - backend/internal/service/overload_failure_breaker_test.go
      - backend/internal/service/openai_overload_failover_test.go
      - backend/internal/service/openai_ws_ingress_overload_test.go
      - backend/internal/repository/overload_failure_cache_test.go
      - backend/internal/service/gateway_failure_policy_test.go
      - backend/internal/service/gateway_failure_policy_stream_test.go
      - backend/internal/service/group_failure_policy_settings_test.go
      - backend/internal/service/group_failure_breaker_test.go
      - backend/internal/service/group_failure_status_rule_test.go
      - backend/internal/service/group_failure_runtime_hooks_test.go
      - backend/internal/service/group_failure_native_scheduling_test.go
      - backend/internal/service/ops_route_switch_label_test.go
      - backend/internal/service/group_failure_recovery_test.go
      - backend/internal/repository/group_failure_cache_test.go
      - backend/internal/handler/admin/setting_handler_group_failure_policy_test.go
      - backend/internal/handler/admin/account_handler_group_failure_recovery_test.go
      - frontend/src/features/gateway-resilience
      - frontend/src/features/gateway-resilience/__tests__/groupFailurePolicy.spec.ts
      - frontend/src/features/gateway-resilience/__tests__/GroupFailurePolicyModal.spec.ts
      - frontend/src/features/gateway-resilience/OpsRouteSwitchEvents.vue
      - frontend/src/features/gateway-resilience/opsRouteSwitchEvents.ts
      - frontend/src/features/gateway-resilience/__tests__/OpsRouteSwitchEvents.spec.ts
      - frontend/src/features/gateway-resilience/__tests__/opsRouteSwitchEventParser.spec.ts
      - frontend/src/views/admin/__tests__/GroupsView.codexManifest.spec.ts
      - deploy/tests/gateway-failover-smoke.ps1
  - id: operator
    owner: custom/operator
    description: Operator role permissions and management-menu policy.
    tests:
      - backend/internal/authz/...
      - frontend/src/authz
  - id: prompt-audit
    owner: custom/prompt-audit
    description: Prompt capture, audit events, retention and administration UI.
    tests:
      - backend/internal/securityaudit/...
      - frontend/src/features/prompt-audit
  - id: image-studio
    owner: custom/image-studio
    description: Image studio, batch fan-out, references and downloads.
    owned_paths:
      - backend/internal/handler/batch_image_handler.go
      - backend/internal/service/batch_image_*.go
      - backend/internal/repository/batch_image_*.go
      - backend/migrations/9000_custom_batch_image_no_discount.sql
      - frontend/src/api/batchImage.ts
      - frontend/src/composables/useBatchImageAccess.ts
      - frontend/src/features/image-studio
      - frontend/src/views/user/BatchImageGuideView.vue
    tests:
      - backend/internal/service/batch_image_...
      - frontend/src/features/image-studio
  - id: branding
    owner: custom/branding
    description: Runtime site branding and public-facing terminology.
    tests:
      - frontend/src/i18n
  - id: usage-extras
    owner: custom/usage-extras
    description: Admin-only usage presentation and API-key administration helpers.
    tests:
      - backend/internal/handler/admin/usage_handler.go
      - backend/internal/handler/admin/apikey_full_edit_test.go
      - backend/internal/service/admin_apikey_update_test.go
      - frontend/src/components/admin/user/__tests__/UserApiKeysModal.spec.ts
      - frontend/src/components/admin/user/__tests__/AdminUserApiKeyEditor.spec.ts
      - frontend/src/components/keys/ApiKeyEditorDialog.vue
      - frontend/src/features/key-editor
      - frontend/src/views/admin
  - id: pelican-showcase
    owner: custom/pelican-showcase
    description: Group-scoped scheduled test plans and read-only group comparison showcase; currently an unpublished candidate.
    owned_paths:
      - backend/internal/handler/pelican_showcase_handler.go
      - backend/internal/server/routes/pelican_showcase.go
      - backend/internal/service/pelican_showcase_service.go
      - backend/internal/service/pelican_showcase_service_test.go
      - backend/internal/service/scheduled_test_*.go
      - backend/internal/repository/scheduled_test_repo.go
      - backend/internal/handler/admin/scheduled_test_handler.go
      - backend/migrations/9005_custom_pelican_scheduled_test_kind.sql
      - frontend/src/api/pelicanShowcase.ts
      - frontend/src/api/__tests__/pelicanShowcase.spec.ts
      - frontend/src/views/PelicanShowcaseView.vue
    migrations:
      - backend/migrations/9005_custom_pelican_scheduled_test_kind.sql
    host_hooks:
      - backend/internal/handler/handler.go
      - backend/internal/handler/wire.go
      - backend/internal/server/router.go
      - backend/cmd/server/wire_gen.go
      - frontend/src/router/index.ts
      - frontend/src/components/layout/AppSidebar.vue
    tests:
      - backend-pelican
      - frontend-pelican

policies:
  generated_sources:
    - backend/ent
    - backend/cmd/server/wire_gen.go
  immutable_migrations: true
  # Reserved custom numbering; already-published migrations remain immutable.
  custom_migration_pattern: '^9[0-9]{3}_custom_[a-z0-9][a-z0-9_-]*\.sql$'
  production_deploy_from_sync_pr: false

# Optional infrastructure, built separately from the application image. No
# frontend flag, main gateway hook, or migration is required for this ingress.
deployment_extensions:
  - id: direct-access
    owner: custom/operator
    source: backend/cmd/direct-access
    deployment: deploy/direct-access
    permission_attribute: moshu_direct_access
    tests:
      - backend/cmd/direct-access/main_test.go
      - backend/cmd/direct-access/main_integration_test.go
      - deploy/direct-access/acceptance.py
