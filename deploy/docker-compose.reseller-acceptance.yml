name: moshu-reseller-acceptance

x-app-common: &app-common
  restart: unless-stopped
  environment: &app-env
    AUTO_SETUP: "true"
    SERVER_HOST: 0.0.0.0
    SERVER_PORT: 8080
    SERVER_MODE: release
    RUN_MODE: standard
    DATABASE_PORT: 5432
    DATABASE_USER: sub2api
    DATABASE_PASSWORD: acceptance-db-password
    DATABASE_DBNAME: sub2api
    DATABASE_SSLMODE: disable
    REDIS_PORT: 6379
    REDIS_PASSWORD: acceptance-redis-password
    ADMIN_PASSWORD: Acceptance-Only-25804664
    JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    TOTP_ENCRYPTION_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
    SECURITY_URL_ALLOWLIST_ENABLED: "false"
    SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP: "true"
    SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS: "true"
    LOG_OUTPUT_TO_FILE: "false"
    TZ: Asia/Shanghai
  networks: [acceptance]

x-postgres-common: &postgres-common
  image: postgres:18-alpine
  restart: unless-stopped
  environment:
    POSTGRES_USER: sub2api
    POSTGRES_PASSWORD: acceptance-db-password
    POSTGRES_DB: sub2api
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api"]
    interval: 3s
    timeout: 3s
    retries: 20
  networks: [acceptance]

x-redis-common: &redis-common
  image: redis:8-alpine
  restart: unless-stopped
  command: ["redis-server", "--requirepass", "acceptance-redis-password", "--appendonly", "yes"]
  healthcheck:
    test: ["CMD", "redis-cli", "-a", "acceptance-redis-password", "ping"]
    interval: 3s
    timeout: 3s
    retries: 20
  networks: [acceptance]

services:
  mock-upstream:
    image: node:24-alpine
    restart: unless-stopped
    command: ["node", "/mock/mock-upstream.mjs"]
    volumes: ["./acceptance/mock-upstream.mjs:/mock/mock-upstream.mjs:ro"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [acceptance]

  main:
    <<: *app-common
    image: moshu-acceptance-main:0.2.5-custom.15
    ports: ["127.0.0.1:18180:8080"]
    environment:
      <<: *app-env
      DATABASE_HOST: main-db
      REDIS_HOST: main-redis
      REDIS_DB: 0
      ADMIN_EMAIL: main-admin@acceptance.local
      MOSHU_RESELLER_SERVER_ENABLED: "true"
    depends_on:
      main-db: { condition: service_healthy }
      main-redis: { condition: service_healthy }
    volumes: [main-data:/app/data]

  l1:
    <<: *app-common
    image: moshu-acceptance-proxy:0.2.5-l1.4
    ports: ["127.0.0.1:18181:8080"]
    environment:
      <<: *app-env
      DATABASE_HOST: l1-db
      REDIS_HOST: l1-redis
      REDIS_DB: 0
      ADMIN_EMAIL: l1-admin@acceptance.local
      MOSHU_RESELLER_CLIENT_ENABLED: "true"
      MOSHU_RESELLER_URL: http://main:8080
      MOSHU_RESELLER_ALLOW_HTTP: "true"
    depends_on:
      l1-db: { condition: service_healthy }
      l1-redis: { condition: service_healthy }
      main: { condition: service_healthy }
    volumes: [l1-data:/app/data]

  cos:
    <<: *app-common
    image: moshu-acceptance-proxy:0.2.5-l1.4
    ports: ["127.0.0.1:18182:8080"]
    environment:
      <<: *app-env
      DATABASE_HOST: cos-db
      REDIS_HOST: cos-redis
      REDIS_DB: 0
      ADMIN_EMAIL: cos-admin@acceptance.local
      MOSHU_RESELLER_CLIENT_ENABLED: "true"
      MOSHU_RESELLER_URL: http://main:8080
      MOSHU_RESELLER_ALLOW_HTTP: "true"
    depends_on:
      cos-db: { condition: service_healthy }
      cos-redis: { condition: service_healthy }
      main: { condition: service_healthy }
    volumes: [cos-data:/app/data]

  main-db:
    <<: *postgres-common
    volumes: [main-db:/var/lib/postgresql]
  l1-db:
    <<: *postgres-common
    volumes: [l1-db:/var/lib/postgresql]
  cos-db:
    <<: *postgres-common
    volumes: [cos-db:/var/lib/postgresql]

  main-redis:
    <<: *redis-common
    volumes: [main-redis:/data]
  l1-redis:
    <<: *redis-common
    volumes: [l1-redis:/data]
  cos-redis:
    <<: *redis-common
    volumes: [cos-redis:/data]

networks:
  acceptance:
    name: moshu-reseller-acceptance

volumes:
  main-data:
  l1-data:
  cos-data:
  main-db:
  l1-db:
  cos-db:
  main-redis:
  l1-redis:
  cos-redis:
